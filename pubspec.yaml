name: lesson_flutter
description: "講義のサンプル用コード."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

## ここにライブラリの依存関係を追加していきます。
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_hooks: ^0.21.2
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  http: ^1.4.0
  dio: ^5.8.0+1
  shared_preferences: ^2.5.3

  ## firebase関係
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12


dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.5.4
  freezed: ^3.0.6
  json_serializable: ^6.9.5

  flutter_lints: ^5.0.0
